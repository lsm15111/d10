  <!-- 바닥글: 대표 흐름과 개인정보 규칙 -->
  <text x="250" y="1032" class="b-text">흐름 예 ① 가견적: web → /api/quotes → quote.service → calc → PostgreSQL</text>
  <text x="250" y="1056" class="b-text">흐름 예 ② 설명: quote.service → Redis 큐 → worker → agent → LLM → 숫자 검산 → quote.service가 저장</text>
  <text x="1130" y="1032" class="b-text">개인정보: 동·호수·연락처는 실측 확정과</text>
  <text x="1130" y="1056" class="b-text">고객 동의 뒤 그 업체에만 보임</text>
</svg>
