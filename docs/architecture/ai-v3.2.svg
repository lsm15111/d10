<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" style="background:#FAFAF8">
<title>믿집 AI 구조 (첨부안 반영)</title>
<desc>첨부한 AI 시스템 아키텍처(예상 공정표 · 업체 추천 에이전트, RAG(pgvector), PostgreSQL, LLM)를 믿집 규칙에 맞춘 구조. 숫자는 계산 엔진만 만들고, 에이전트는 설명 · 고르기만 한다.</desc>
<style>
.t-title { font-size: 26px; font-weight: 700; fill: #1B2127; }
.t-sub { font-size: 15px; fill: #5A6772; }
.g-label { font-size: 15px; font-weight: 700; fill: #33414D; }
.b-title { font-size: 16px; font-weight: 700; fill: #1B2127; }
.s-title { font-size: 14px; font-weight: 700; fill: #1B2127; }
.b-text { font-size: 14px; fill: #2B353E; }
.b-small { font-size: 13px; fill: #2B353E; }
.b-mute { font-size: 12.5px; fill: #5A6772; }
.a-label { font-size: 12.5px; fill: #4A5762; }
.bd-t { font-size: 12px; font-weight: 700; }
.grp { fill: #F4F5F3; stroke: #C9D0D6; stroke-width: 1.2; }
.box { fill: #FFFFFF; stroke: #2F3B45; stroke-width: 1.5; }
.box-core { fill: #EEF6F2; stroke: #1E6B55; stroke-width: 1.8; }
.box-data { fill: #EEF2F8; stroke: #33507A; stroke-width: 1.8; }
.box-ai { fill: #FFF6EC; stroke: #B5651D; stroke-width: 1.8; }
.box-sub { fill: #FFFFFF; stroke: #9AABC0; stroke-width: 1.1; }
.box-ext { fill: #FFFFFF; stroke: #6B5E45; stroke-width: 1.5; }
.box-off { fill: #FFFFFF; stroke: #B23B2E; stroke-width: 1.5; stroke-dasharray: 7 5; }
.box-dash { fill: #FFFFFF; stroke: #5A6772; stroke-width: 1.4; stroke-dasharray: 7 5; }
.ar { stroke: #2F3B45; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
.ar-q { stroke: #B5651D; stroke-width: 1.6; fill: none; marker-end: url(#ahq); }
.ar-d { stroke: #5A6772; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#ah); }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F3B45"/></marker><marker id="ahq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B5651D"/></marker></defs>
<rect width="1800" height="1290" fill="#FAFAF8"/>
<text x="24" y="42" class="t-title">믿집 AI 구조 (첨부안 반영)</text>
<text x="24" y="70" class="t-sub">예상 공정표 · 업체 추천 · 확정 공정표 에이전트 · 숫자(금액 · 기간 · 날짜 · 점수)는 계산 엔진만 만든다 · 배지 = 첨부안과 비교</text>
<text x="1330" y="66" class="b-small">첨부안과 비교</text>
<rect x="1442.0" y="51" width="42.0" height="21" rx="10.5" fill="#1E6B55" stroke="#1E6B55" stroke-width="1.2"/><text x="1463.0" y="66" class="bd-t" text-anchor="middle" fill="#FFFFFF">유지</text>
<rect x="1528.0" y="51" width="42.0" height="21" rx="10.5" fill="#B5651D" stroke="#B5651D" stroke-width="1.2"/><text x="1549.0" y="66" class="bd-t" text-anchor="middle" fill="#FFFFFF">바꿈</text>
<rect x="1614.0" y="51" width="42.0" height="21" rx="10.5" fill="#2F5DA8" stroke="#2F5DA8" stroke-width="1.2"/><text x="1635.0" y="66" class="bd-t" text-anchor="middle" fill="#FFFFFF">더함</text>
<rect x="1712.0" y="51" width="30.0" height="21" rx="10.5" fill="#FFFFFF" stroke="#B23B2E" stroke-width="1.2"/><text x="1727.0" y="66" class="bd-t" text-anchor="middle" fill="#B23B2E">뺌</text>
<rect x="16" y="92" width="1768" height="172" rx="10" class="grp"/>
<text x="30" y="118" class="g-label">사용자 입력 (견적 받기 질문 흐름)</text>
<rect x="30" y="132" width="570" height="118" rx="10" class="box"/>
<text x="46" y="160" class="b-title">기본 정보</text>
<rect x="544.0" y="144" width="42.0" height="21" rx="10.5" fill="#1E6B55" stroke="#1E6B55" stroke-width="1.2"/><text x="565.0" y="159" class="bd-t" text-anchor="middle" fill="#FFFFFF">유지</text>
<text x="46" y="188" class="b-small">지역(시 · 군 · 구) · 집 종류 · 평수 · 준공 연도</text>
<text x="46" y="212" class="b-small">시기 · 집 상태 · 예산(선택)</text>
<text x="46" y="236" class="b-mute">첨부안의 스타일 · 특이사항은 추가 요청사항에서 받음</text>
<rect x="615" y="132" width="570" height="118" rx="10" class="box"/>
<text x="631" y="160" class="b-title">선택 공정</text>
<rect x="1129.0" y="144" width="42.0" height="21" rx="10.5" fill="#B5651D" stroke="#B5651D" stroke-width="1.2"/><text x="1150.0" y="159" class="bd-t" text-anchor="middle" fill="#FFFFFF">바꿈</text>
<text x="631" y="188" class="b-small">도배(저가형 · 기본형) · 목공(몰딩 · 걸레받이 · 문 · 평탄화)</text>
<text x="631" y="212" class="b-small">공간별 사진 · 도면</text>
<text x="631" y="236" class="b-mute">타일 · 전기는 1차 범위 밖 (AGENTS.md 1장)</text>
<rect x="1200" y="132" width="570" height="118" rx="10" class="box"/>
<text x="1216" y="160" class="b-title">추가 요청사항 (자유 글)</text>
<rect x="1714.0" y="144" width="42.0" height="21" rx="10.5" fill="#1E6B55" stroke="#1E6B55" stroke-width="1.2"/><text x="1735.0" y="159" class="bd-t" text-anchor="middle" fill="#FFFFFF">유지</text>
<text x="1216" y="188" class="b-small">스타일 · 일정 조건 · 특이사항 · 선택 · 500자까지</text>
<text x="1216" y="212" class="b-small">지금 화면에는 없음 → 넣을지 정할 것</text>
<text x="1216" y="236" class="b-mute">프롬프트에는 연락처 · 주소를 가리고 &#x27;자료&#x27;로만 넣음</text>
<path d="M 900 264 L 900 300" class="ar"/>
<text x="912" y="288" class="a-label" text-anchor="start">POST /projects 저장 → 같은 트랜잭션에 jobs(project_created) → worker</text>
<rect x="16" y="302" width="1768" height="112" rx="10" class="box-core"/>
<text x="32" y="330" class="b-title">계산 엔진 calc (숫자는 여기서만 만든다 · DB · HTTP · 시계를 모르는 순수 함수)</text>
<rect x="1728.0" y="314" width="42.0" height="21" rx="10.5" fill="#2F5DA8" stroke="#2F5DA8" stroke-width="1.2"/><text x="1749.0" y="329" class="bd-t" text-anchor="middle" fill="#FFFFFF">더함</text>
<text x="32" y="362" class="b-small">공정표 초안: 수량 → 품(0.5 올림) → 기간 · 날짜 (휴무일 데이터)</text>
<text x="620" y="362" class="b-small">표준견적서: 기준 단가 × 수량 (단가 · 산식 버전 고정)</text>
<text x="1205" y="362" class="b-small">추천 점수: 후보 거르기(승인 · 지역 · 공정 · 일정) → 점수</text>
<text x="32" y="394" class="b-mute">첨부안의 &#x27;소요 기간(참고)&#x27;, &#x27;조건 기반 필터링&#x27;, &#x27;적합도 판단&#x27;에서 숫자와 거르기를 LLM에서 이쪽으로 옮겼다 (AGENTS.md 3장: LLM이 낸 숫자는 검산 없이 쓰지 않음)</text>
<rect x="16" y="436" width="1768" height="436" rx="10" class="grp"/>
<text x="30" y="462" class="g-label">AI 에이전트 레이어 (3개 · worker 안에서 실행 · 결과 저장 · 상태 변경은 각 기능 service)</text>
<path d="M 900 414 L 900 474" class="ar"/>
<text x="912" y="452" class="a-label" text-anchor="start">계산 결과 + 근거 id를 넘김</text>
<rect x="30" y="476" width="570" height="300" rx="10" class="box-ai"/>
<text x="46" y="504" class="b-title">① 예상 공정표 에이전트 (FAG-01)</text>
<rect x="544.0" y="488" width="42.0" height="21" rx="10.5" fill="#B5651D" stroke="#B5651D" stroke-width="1.2"/><text x="565.0" y="503" class="bd-t" text-anchor="middle" fill="#FFFFFF">바꿈</text>
<text x="46" y="528" class="b-mute">LLM + RAG (pgvector)</text>
<rect x="46" y="544" width="538" height="48" rx="8" class="box-sub"/>
<text x="60" y="564" class="s-title">1. 입력 정리</text>
<text x="60" y="583" class="b-mute">프로젝트 답 · calc 공정표 초안 · 추가 요청사항(가림)</text>
<rect x="46" y="600" width="538" height="48" rx="8" class="box-sub"/>
<text x="60" y="620" class="s-title">2. RAG 검색</text>
<text x="60" y="639" class="b-mute">공정별 시공 가이드 · 체크리스트 → 근거 문서 id</text>
<rect x="46" y="656" width="538" height="48" rx="8" class="box-sub"/>
<text x="60" y="676" class="s-title">3. LLM 작성</text>
<text x="60" y="695" class="b-mute">작업 설명 · 주의사항 · 준비할 일 (날짜 · 기간은 쓰지 않음)</text>
<rect x="46" y="712" width="538" height="48" rx="8" class="box-sub"/>
<text x="60" y="732" class="s-title">4. 검산</text>
<text x="60" y="751" class="b-mute">날짜 · 기간이 calc와 같은지 · 목공 → 도배 순서 · 휴무일</text>
<rect x="615" y="476" width="570" height="300" rx="10" class="box-ai"/>
<text x="631" y="504" class="b-title">② 업체 추천 에이전트 (FAG-02)</text>
<rect x="1129.0" y="488" width="42.0" height="21" rx="10.5" fill="#B5651D" stroke="#B5651D" stroke-width="1.2"/><text x="1150.0" y="503" class="bd-t" text-anchor="middle" fill="#FFFFFF">바꿈</text>
<text x="631" y="528" class="b-mute">LLM · pgvector는 나중 (업체 소개 · 포트폴리오 유사도)</text>
<rect x="631" y="544" width="538" height="48" rx="8" class="box-sub"/>
<text x="645" y="564" class="s-title">1. 후보 거르기 (SQL)</text>
<text x="645" y="583" class="b-mute">승인 업체 · 시공 지역 · 공정 · 일정 가능</text>
<rect x="631" y="600" width="538" height="48" rx="8" class="box-sub"/>
<text x="645" y="620" class="s-title">2. 점수 (calc)</text>
<text x="645" y="639" class="b-mute">규칙 점수로 상위 10곳 · 예산은 거르기에 쓰지 않음</text>
<rect x="631" y="656" width="538" height="48" rx="8" class="box-sub"/>
<text x="645" y="676" class="s-title">3. LLM 고르기</text>
<text x="645" y="695" class="b-mute">3곳 + 추천 이유 (후보 id 안에서만)</text>
<rect x="631" y="712" width="538" height="48" rx="8" class="box-sub"/>
<text x="645" y="732" class="s-title">4. 검산</text>
<text x="645" y="751" class="b-mute">후보 밖 id · 지역 밖 업체면 버림 (치명 오류)</text>
<rect x="1200" y="476" width="570" height="300" rx="10" class="box-ai"/>
<text x="1216" y="504" class="b-title">③ 확정 공정표 에이전트 (FAG-03)</text>
<rect x="1714.0" y="488" width="42.0" height="21" rx="10.5" fill="#2F5DA8" stroke="#2F5DA8" stroke-width="1.2"/><text x="1735.0" y="503" class="bd-t" text-anchor="middle" fill="#FFFFFF">더함</text>
<text x="1216" y="528" class="b-mute">첨부안에 없음 · 요구사항 v3.2에 있음</text>
<rect x="1216" y="544" width="538" height="48" rx="8" class="box-sub"/>
<text x="1230" y="564" class="s-title">1. 입력</text>
<text x="1230" y="583" class="b-mute">확정 업체가 등록한 공사기간 (FFV-06 · 07)</text>
<rect x="1216" y="600" width="538" height="48" rx="8" class="box-sub"/>
<text x="1230" y="620" class="s-title">2. 일정 (calc)</text>
<text x="1230" y="639" class="b-mute">반나절 단위 · 휴무일 · 공정 순서</text>
<rect x="1216" y="656" width="538" height="48" rx="8" class="box-sub"/>
<text x="1230" y="676" class="s-title">3. LLM 작성</text>
<text x="1230" y="695" class="b-mute">순서 설명 · 할 일 (관리사무소 신고 등)</text>
<rect x="1216" y="712" width="538" height="48" rx="8" class="box-sub"/>
<text x="1230" y="732" class="s-title">4. 검산</text>
<text x="1230" y="751" class="b-mute">휴무일 작업 · 겹침 · 도배가 목공보다 먼저면 버림</text>
<rect x="30" y="790" width="1740" height="70" rx="10" class="box-sub"/>
<text x="46" y="816" class="b-small">공통 규칙: llm.py 한 곳 · 공급자 하나 · 프롬프트 버전 · Pydantic 스키마 검사 · 실행 기록(입력 스냅숏 · 모델 · 프롬프트 버전 · 비용 · 시간)은 jobs 행</text>
<text x="46" y="842" class="b-small">CI는 스텁(LLM_LIVE=false) · LLM이 실패하면 계산 결과만 보이고 &#x27;설명을 만들지 못했어요&#x27; · 화면에 AI가 쓴 글이라는 안내 · eval 추천 20 · 공정표 15</text>
<rect x="1714.0" y="801" width="42.0" height="21" rx="10.5" fill="#2F5DA8" stroke="#2F5DA8" stroke-width="1.2"/><text x="1735.0" y="816" class="bd-t" text-anchor="middle" fill="#FFFFFF">더함</text>
<path d="M 315 900 L 315 874" class="ar"/>
<text x="325" y="892" class="a-label" text-anchor="start">근거 문서</text>
<path d="M 900 900 L 900 874" class="ar-d"/>
<text x="910" y="892" class="a-label" text-anchor="start">나중</text>
<rect x="16" y="902" width="1768" height="76" rx="10" class="box-data"/>
<text x="32" y="930" class="b-title">RAG 검색 (pgvector · 같은 PostgreSQL)</text>
<rect x="1728.0" y="914" width="42.0" height="21" rx="10.5" fill="#B5651D" stroke="#B5651D" stroke-width="1.2"/><text x="1749.0" y="929" class="bd-t" text-anchor="middle" fill="#FFFFFF">바꿈</text>
<text x="360" y="930" class="b-small">공정 · 주제 · 버전으로 먼저 거르고 → 벡터 검색 상위 5개 → 문서 id · 출처 · 적용일을 근거로 함께 넘김</text>
<text x="32" y="960" class="b-mute">따로 두는 벡터 DB · 검색 서비스는 없다 → app/agent/retrieval.py 함수 하나 · 첨부안의 &#x27;RAG 검색 레이어&#x27;는 층이 아니라 함수</text>
<rect x="16" y="998" width="1768" height="276" rx="10" class="grp"/>
<text x="30" y="1024" class="g-label">데이터 레이어</text>
<path d="M 600 1012 L 600 980" class="ar"/>
<rect x="30" y="1038" width="1150" height="222" rx="10" class="box-data"/>
<text x="46" y="1066" class="b-title">PostgreSQL 17 + pgvector (원본 하나 · 벡터 DB를 따로 두지 않음)</text>
<rect x="46" y="1080" width="366" height="166" rx="10" class="box-sub"/>
<text x="62" y="1108" class="s-title">구조 데이터 (SQL로 읽음)</text>
<rect x="356.0" y="1092" width="42.0" height="21" rx="10.5" fill="#B5651D" stroke="#B5651D" stroke-width="1.2"/><text x="377.0" y="1107" class="bd-t" text-anchor="middle" fill="#FFFFFF">바꿈</text>
<text x="62" y="1136" class="b-small">ref_prices: 표준시장단가 · 노임단가 · 조달청</text>
<text x="62" y="1160" class="b-small">holidays · 업체(승인 · 지역 · 공정 · 평점 · 후기)</text>
<text x="62" y="1184" class="b-small">프로젝트 · 공간 · 공정</text>
<text x="62" y="1208" class="b-mute">첨부안의 공공데이터 → RAG를 표로 옮김</text>
<rect x="424" y="1080" width="366" height="166" rx="10" class="box-sub"/>
<text x="440" y="1108" class="s-title">RAG 문서 (rag_chunks · 벡터)</text>
<rect x="734.0" y="1092" width="42.0" height="21" rx="10.5" fill="#B5651D" stroke="#B5651D" stroke-width="1.2"/><text x="755.0" y="1107" class="bd-t" text-anchor="middle" fill="#FFFFFF">바꿈</text>
<text x="440" y="1136" class="b-small">공정별 시공 가이드 · 체크리스트 (팀이 씀)</text>
<text x="440" y="1160" class="b-small">공개 기준 문서 (이용 조건 확인 뒤)</text>
<text x="440" y="1184" class="b-small">믿집 완공 사례 (고객 동의 뒤 · 나중)</text>
<text x="440" y="1208" class="b-mute">열: 출처 · 적용일 · 버전 · 이용 조건</text>
<rect x="802" y="1080" width="362" height="166" rx="10" class="box-off"/>
<text x="818" y="1108" class="s-title">넣지 않음</text>
<rect x="1120.0" y="1092" width="30.0" height="21" rx="10.5" fill="#FFFFFF" stroke="#B23B2E" stroke-width="1.2"/><text x="1135.0" y="1107" class="bd-t" text-anchor="middle" fill="#B23B2E">뺌</text>
<text x="818" y="1136" class="b-small">커뮤니티 글 (약관 · 저작권 · 개인정보)</text>
<text x="818" y="1160" class="b-small">지어낸 사례 · 실적</text>
<text x="818" y="1184" class="b-small">믿집 밖 시공 건수 (셀 수 없음)</text>
<text x="818" y="1208" class="b-mute">privacy-rules.md</text>
<path d="M 1182 1150 L 1194 1150" class="ar"/>
<path d="M 1194 1170 L 1182 1170" class="ar"/>
<rect x="1196" y="1038" width="574" height="222" rx="10" class="box-ext"/>
